name: CI

on:
  push:
    branches: [main, testing, staging, "claude/**"]
  pull_request:
    branches: [main, testing, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ── Jobs ───────────────────────────────────────────────────────────────────────

jobs:

  # ── 1. Rust server: fmt + clippy + unit tests + integration tests ────────────
  server:
    name: Server (Rust)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Install system deps (OpenSSL / pkg-config)
        run: sudo apt-get update -q && sudo apt-get install -y -q pkg-config libssl-dev

      - name: Check formatting
        working-directory: server
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        working-directory: server
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Unit tests
        working-directory: server
        run: cargo test --lib -- --nocapture

      - name: Integration tests
        working-directory: server
        run: cargo test --test integration -- --nocapture
        env:
          RUST_LOG: warn   # quieter output in CI

  # ── 2. TypeScript client: lint + type-check + build ─────────────────────────
  client:
    name: Client (TypeScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Lint
        working-directory: client
        run: npm run lint

      - name: Type-check + build
        working-directory: client
        run: npm run build

  # ── 3. Tauri desktop build matrix (Windows · Linux · macOS) ─────────────────
  tauri:
    name: Tauri (${{ matrix.platform }})
    needs: [server, client]   # only build native apps if server + client pass
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-22.04
            args: ""
          - platform: Windows
            os: windows-latest
            args: ""
          - platform: macOS
            os: macos-latest
            args: "--target universal-apple-darwin"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust (Tauri)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: Install Linux system deps (WebKit2GTK etc.)
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: client
          args: ${{ matrix.args }}

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: anna-sync-${{ matrix.platform }}-${{ github.sha }}
          path: |
            client/src-tauri/target/release/bundle/**/*.deb
            client/src-tauri/target/release/bundle/**/*.AppImage
            client/src-tauri/target/release/bundle/**/*.exe
            client/src-tauri/target/release/bundle/**/*.msi
            client/src-tauri/target/release/bundle/**/*.dmg
            client/src-tauri/target/release/bundle/**/*.app
          if-no-files-found: warn
          retention-days: 7
