name: Start AnNa Instance

# Manually start a single, ephemeral AnNa server instance on a GitHub-hosted
# runner — useful for ad-hoc demos or poking at a live instance without
# standing up real cloud infrastructure (see deploy.yml for that path).
#
# The runner only exposes the service to itself (127.0.0.1); there is no
# public URL. The instance is torn down when the job ends or times out.

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: How long to keep the instance running (minutes, max 340)
        required: false
        default: "60"

permissions:
  contents: read

concurrency:
  group: start-instance
  cancel-in-progress: false

jobs:
  run-instance:
    name: Build, run, and hold one instance
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t anna-instance:${{ github.sha }} .

      - name: Start instance as a background service
        run: |
          docker run -d --name anna-instance \
            -p 3000:3000 \
            -e RUST_LOG=info \
            anna-instance:${{ github.sha }}

      - name: Wait for the service to become healthy
        run: |
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/status >/dev/null; then
              echo "✓ Instance is up: http://127.0.0.1:3000"
              curl -sf http://127.0.0.1:3000/api/status
              exit 0
            fi
            sleep 1
          done
          echo "::error::Instance never became healthy"
          docker logs anna-instance
          exit 1

      - name: Hold instance running
        run: |
          minutes="${{ github.event.inputs.duration_minutes }}"
          minutes="${minutes:-60}"
          # Cap to the job timeout minus setup/teardown headroom.
          if [ "$minutes" -gt 340 ]; then
            minutes=340
          fi
          echo "Holding instance for ${minutes} minute(s)..."
          sleep "$(( minutes * 60 ))"

      - name: Stop instance
        if: always()
        run: |
          docker logs anna-instance --tail 100 || true
          docker rm -f anna-instance || true
