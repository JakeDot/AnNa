[package]
name = "anna-sync-server"
version = "0.4.5"
edition = "2021"
authors = ["AnNa Team"]

[[bin]]
name = "anna-sync-server"
path = "src/main.rs"

[lib]
name = "anna_sync_server"
path = "src/lib.rs"

[dependencies]
# Web framework with HTTP/2 and HTTP/3 support
axum = { version = "0.7", features = ["http2", "ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "cors", "compression-br", "trace", "set-header"] }

# WebSocket for signaling
tokio-tungstenite = "0.21"
futures-util = "0.3"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Hashing and crypto
sha2 = "0.10"
blake3 = "1.5"
hex = "0.4"

# File handling
tokio-util = { version = "0.7", features = ["io"] }

# Content-defined chunking
fastcdc = "3.1"

# Compression (kept for legacy file decompression)
brotli = "3.5"
async-compression = { version = "0.4", features = ["tokio", "brotli", "zstd"] }

# QUIC / HTTP3 — optional; disable via default-features = false when embedding
# the server in a desktop app (e.g. Tauri) to avoid the heavy TLS/QUIC deps.
quinn = { version = "0.11", optional = true }
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }

# TLS (required by QUIC; rcgen generates a self-signed cert at startup)
rustls = { version = "0.23", features = ["ring"], optional = true }
rustls-pemfile = { version = "2", optional = true }
rcgen = { version = "0.13", optional = true }

# HTTP body utilities (used in QUIC request adapter)
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5.5"
jsonwebtoken = "9"
reqwest = { version = "0.12", features = ["json"] }
async-trait = "0.1"

[features]
default = ["quic"]
quic = [
    "dep:quinn",
    "dep:h3",
    "dep:h3-quinn",
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:rcgen",
    "dep:http-body-util",
    "dep:bytes",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
tempfile = "3"
serde_json = "1.0"
